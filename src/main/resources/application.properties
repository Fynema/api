spring.application.name=api

# --- Database ---
spring.datasource.url=jdbc:mariadb://localhost:3306/fynema
spring.datasource.username=fynema_user
spring.datasource.password=fynema_password
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- JWT ---
security.jwt.accessSecret=${JWT_SECRET}
security.jwt.refreshSecret=${JWT_REFRESH_SECRET}
# 15 minutes
security.jwt.expiration=900000

# --- Jackett ---
jackett.api.url=http://localhost:9117
jackett.api.key=${JACKETT_API_KEY}

# --- The Movie Database (TMDb) ---
tmdb.api.key=${TMDB_API_KEY}

# --- Aria2 ---
aria2.rpc-url=http://localhost:6800/jsonrpc
aria2.rpc-secret=your_rpc_secret